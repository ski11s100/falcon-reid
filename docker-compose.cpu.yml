# Запуск без видеокарты NVIDIA — например, на обычном облачном сервере для
# работающего прототипа (раздел 13 ТЗ) или на ноутбуке члена жюри:
#
#     docker compose -f docker-compose.yml -f docker-compose.cpu.yml up --build
#
# Всё остальное то же: те же веса, порог, правило двойников и интерфейс. Поиск
# на процессоре идёт за секунды, а не за десятки миллисекунд: для показа этого
# хватает, для замера скорости — нет (скорость меряется на GPU, раздел 7 ТЗ).
services:
  api:
    environment:
      FALCON_DEVICE: cpu
    # Резервирование видеокарты снимается: без драйвера NVIDIA Docker иначе
    # отказывается запускать контейнер.
    deploy: !reset {}
