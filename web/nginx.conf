# ФАЛЬКОН — клиентская часть и входная точка решения.
#
# Раздел 6 ТЗ требует разделить backend инференса, базу данных и клиентскую
# часть. Этот контейнер — клиентская часть: отдаёт интерфейс оператора и
# проксирует API к контейнеру инференса, который наружу не открыт вовсе.
#
# Заодно он первый рубеж защиты: ограничивает размер тела и частоту запросов
# до того, как они дойдут до видеокарты, и ставит заголовки безопасности.

# 50 запросов в секунду с одного адреса с запасом на пачки — оператору и
# интеграции с камерами хватает, а заваливание сервиса запросами упирается сюда.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Адрес контейнера api разрешается во время запроса, а не при старте.
    # С «proxy_pass http://api:8000» nginx искал имя api при запуске, и если
    # контейнер api в этот момент не работал (перезапуск, долгая загрузка
    # модели, остановка на время обучения), nginx падал целиком и уходил в цикл
    # перезапусков — интерфейс пропадал вместе с API. Теперь интерфейс
    # открывается всегда и сам говорит, что сервис распознавания не отвечает.
    # 127.0.0.11 — встроенный DNS Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    root /usr/share/nginx/html;

    # Пачка до 200 снимков в Base64 (см. max_batch_mb в service/config.py).
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Те же заголовки, что ставит сам сервис (service/security.py): интерфейс
    # обязан быть защищён одинаково, кто бы его ни отдавал.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Кеш — через expires, а не add_header: add_header внутри location
    # отменяет наследование заголовков безопасности уровня server, и страница
    # уходила бы без CSP. Проверено на собранном контейнере.
    location = / {
        expires -1;
        try_files /static/index.html =404;
    }

    location /static/ {
        expires -1;
        try_files $uri =404;
    }

    # API и документация — к контейнеру инференса. Его собственные заголовки
    # безопасности приходят вместе с ответом.
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    # Swagger UI содержит встроенный скрипт инициализации: строгий CSP
    # интерфейса ему не подходит, поэтому здесь его нет.
    location ~ ^/(docs|docs-assets/|openapi\.json) {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
