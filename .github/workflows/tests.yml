# Автоматическая проверка решения при каждом изменении.
#
# Раздел 6 ТЗ требует воспроизводимости из исходного кода, а раздел 9 не
# допускает к оценке решения, которые не воспроизводятся. Здесь на чистой
# машине ставятся зафиксированные зависимости и прогоняются все тесты, включая
# сверку наших метрик с эталонным скриптом организаторов. Видеокарта не нужна:
# тесты работают на процессоре.

name: Тесты

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false          # веса моделей тестам не нужны, это 400 МБ трафика

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          # На CI ставится сборка PyTorch для процессора: в образе решения —
          # та же версия, но с CUDA (см. Dockerfile).
          pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Тесты
        run: python -m unittest discover -s tests -v

      - name: Известные уязвимости зависимостей
        run: pip-audit -r requirements.txt
