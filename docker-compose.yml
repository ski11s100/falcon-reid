# Запуск всего решения одной командой: docker compose up
#
# Раздел 6 ТЗ требует микросервисного разделения ответственности и векторной
# либо реляционной СУБД, называя PostgreSQL с pgvector в качестве примера.
# Здесь три роли разведены по контейнерам:
#   postgres — хранение эмбеддингов галереи и метаданных, индекс HNSW;
#   api      — инференс ReID-модели и HTTP-контракт с OpenAPI;
#   клиент   — статика, отдаётся сервисом api, работает в браузере.

services:
  postgres:
    # Официальный образ pgvector: расширение уже собрано, ставить нечего.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: falcon
      POSTGRES_DB: falcon
    volumes:
      - falcon-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        # Сервис создаёт таблицу и индекс на старте, поэтому ждём готовности БД,
        # а не просто запуска контейнера.
        condition: service_healthy
    environment:
      FALCON_DATABASE_DSN: postgresql://falcon:falcon@postgres:5432/falcon
      # Тот же ансамбль, что идёт в сдачу: порог откалиброван под этот состав
      # моделей и на одиночную модель не переносится.
      FALCON_CHECKPOINTS: /opt/falcon/models/model-a.pt,/opt/falcon/models/model-b.pt
      FALCON_DEVICE: cuda
      FALCON_HOST: "0.0.0.0"
      FALCON_PORT: "8000"
      # Порог отказа, откалиброванный на локальном сплите под этот ансамбль
      # (runs/v5-final/calibration.json). Максимизирует 0.7*F1 + 0.3*TNR.
      FALCON_MATCH_THRESHOLD: "0.411"
    # Разделяемая память для загрузчика данных. Решение умеет работать и при
    # 64 МБ по умолчанию (falcon/extract.py переключает обмен на файловую
    # систему), но с нормальным объёмом оно чуть быстрее.
    shm_size: "2gb"
    ports:
      - "8000:8000"
    volumes:
      - falcon-data:/opt/falcon/data
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  falcon-db:
  falcon-data:
