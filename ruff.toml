# Настройки линтера ruff. Запуск: ruff check . (см. requirements-dev.txt),
# в CI — отдельным шагом .github/workflows/tests.yml.
#
# Смысл набора: ловить настоящие ошибки (неиспользуемые имена, затенённые
# переменные, ловушки вроде изменяемого значения по умолчанию), но не спорить о
# вкусовщине. Всё, что отключено ниже, отключено осознанно и с причиной.

line-length = 110
target-version = "py312"

# organizers/ — скрипт организаторов, он не наш и правкам не подлежит.
# legacy/ — архив версий v1-v4, он не участвует в сдаче (legacy/README.md).
exclude = [".venv", "organizers", "legacy", "runs", "submission"]

[lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    # FastAPI объявляет зависимости и загрузку файлов именно так:
    # def search(file: UploadFile = File(...)). Для B008 это «вызов в значении
    # по умолчанию», для FastAPI — единственный способ.
    "B008",
    # zip(..., strict=) — в коде все zip идут по спискам одинаковой длины,
    # построенным рядом; требование явного флага только зашумило бы строки.
    "B905",
    # Короткие лямбды-помощники в рисовании SVG (x = lambda t: ...) читаются
    # лучше вложенных def на две строки.
    "E731",
    # Однострочные if и парные операторы через ; оставлены там, где они
    # компактнее и яснее: это редкие места в замерах и рисовании.
    "E701",
    "E702",
    # %-форматирование в нескольких старых скриптах замеров; менять его — шум
    # в истории без выгоды.
    "UP031",
]

[lint.per-file-ignores]
# Скрипты и обучение подкладывают корень проекта в sys.path до импортов:
# иначе их нельзя запустить как python scripts/....
"scripts/*" = ["E402"]
"falcon/train.py" = ["E402"]
"tests/*" = ["E402"]
